<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - SIGAO_UTZMG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow border-0 p-4">
          <div class="text-center mb-4">
            <i class="bi bi-cpu-fill text-primary" style="font-size: 3rem;"></i>
            <h3 class="fw-bold mt-2">Control Laboratorios</h3>
            <p class="text-muted small">Ingreso institucional con credenciales UTZMG</p>
          </div>

          {% if error %}
          <div class="alert alert-danger py-2 small">{{ error }}</div>
          {% endif %}

          <form action="/login" method="post">
            <div class="mb-3">
              <label class="form-label small fw-bold">Matrícula o Nómina</label>
              <input type="text" name="matricula_nomina" class="form-control" required placeholder="Ej. 22030104 o DOC-01">
            </div>
            <div class="mb-4">
              <label class="form-label small fw-bold">Contraseña</label>
              <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Iniciar Sesión</button>
          </form>

          <div class="border-top mt-4 pt-3 text-center">
            <p class="small text-muted mb-1">¿No tienes cuenta registrada?</p>
            <a href="/registro" class="btn btn-outline-secondary btn-sm w-100">Solicitar Registro de Acceso</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
